<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Fulfillment - ACME Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #1a1a2e; color: white; padding: 20px 40px; }
    .header h1 { font-size: 24px; }
    .container { max-width: 600px; margin: 60px auto; padding: 0 20px; }
    .card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); text-align: center; }
    .spinner { width: 48px; height: 48px; border: 4px solid #eee; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success-icon { font-size: 64px; margin-bottom: 16px; }
    .card h2 { font-size: 24px; margin-bottom: 8px; }
    .card p { color: #666; margin-bottom: 24px; }
    .details { text-align: left; background: #f9f9f9; border-radius: 8px; padding: 16px; margin: 20px 0; }
    .details .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .details .row:last-child { border-bottom: none; }
    .details .label { color: #888; }
    .details .value { font-weight: 600; }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-success { background: #d4edda; color: #155724; }
    .btn { display: inline-block; margin-top: 20px; padding: 12px 32px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #16213e; }
    .fulfill-btn { background: #28a745; }
    .fulfill-btn:hover { background: #218838; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ACME Store</h1>
  </div>
  <div class="container">
    <div class="card" id="content">
      <div class="spinner"></div>
      <h2>Processing Payment...</h2>
      <p>Please wait while we confirm your payment.</p>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    const params = new URLSearchParams(window.location.search);
    const paymentId = params.get('paymentId');
    const orderId = params.get('orderId');

    async function init() {
      if (!paymentId || !orderId) {
        showError('Missing payment or order information.');
        return;
      }

      const res = await fetch(`${API_BASE}/api/payments/${paymentId}`);
      const data = await res.json();

      if (data.payment.status === 'CAPTURED') {
        showSuccess(data.payment);
      } else {
        showPending(data.payment);
      }
    }

    function showPending(payment) {
      const order = payment.order;
      const items = order.items.map(i => `${i.product.name} x${i.quantity}`).join(', ');

      document.getElementById('content').innerHTML = `
        <h2>Complete Your Payment</h2>
        <p>Your order has been created. Click below to simulate payment fulfillment via DummyPay.</p>
        <div class="details">
          <div class="row"><span class="label">Order</span><span class="value">${order.orderNumber}</span></div>
          <div class="row"><span class="label">Items</span><span class="value">${items}</span></div>
          <div class="row"><span class="label">Amount</span><span class="value">${payment.currency} ${payment.amount.toLocaleString('en-IN')}</span></div>
          <div class="row"><span class="label">Status</span><span class="value"><span class="status-badge status-pending">PENDING</span></span></div>
        </div>
        <button class="btn fulfill-btn" onclick="fulfillPayment()">Confirm Payment (DummyPay)</button>
        <br>
        <a href="index.html" class="btn" style="background:#666; margin-top:10px;">Back to Store</a>
      `;
    }

    function showSuccess(payment) {
      const order = payment.order;
      const items = order.items.map(i => `${i.product.name} x${i.quantity}`).join(', ');

      document.getElementById('content').innerHTML = `
        <div class="success-icon">&#10004;</div>
        <h2>Payment Successful!</h2>
        <p>Thank you for your purchase. Your order has been confirmed.</p>
        <div class="details">
          <div class="row"><span class="label">Order</span><span class="value">${order.orderNumber}</span></div>
          <div class="row"><span class="label">Items</span><span class="value">${items}</span></div>
          <div class="row"><span class="label">Amount</span><span class="value">${payment.currency} ${payment.amount.toLocaleString('en-IN')}</span></div>
          <div class="row"><span class="label">Transaction ID</span><span class="value">${payment.transactionId}</span></div>
          <div class="row"><span class="label">Payment Method</span><span class="value">${payment.paymentMethod}</span></div>
          <div class="row"><span class="label">Status</span><span class="value"><span class="status-badge status-success">CAPTURED</span></span></div>
        </div>
        <a href="index.html" class="btn">Continue Shopping</a>
      `;
    }

    function showError(msg) {
      document.getElementById('content').innerHTML = `
        <div class="success-icon" style="color:#dc3545;">&#10008;</div>
        <h2>Something went wrong</h2>
        <p>${msg}</p>
        <a href="index.html" class="btn">Back to Store</a>
      `;
    }

    async function fulfillPayment() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const res = await fetch(`${API_BASE}/api/payments/${paymentId}/fulfill`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentMethod: 'card' }),
        });
        const data = await res.json();

        if (data.success) {
          const payRes = await fetch(`${API_BASE}/api/payments/${paymentId}`);
          const payData = await payRes.json();
          showSuccess(payData.payment);
        } else {
          showError('Fulfillment failed. Please try again.');
        }
      } catch (err) {
        showError('Error: ' + err.message);
      }
    }

    init();
  </script>
</body>
</html>
